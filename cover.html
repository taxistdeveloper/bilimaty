<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400..700&family=Inter:wght@400;600&display=swap"><style>
body{margin:0}section{width:1920px;height:1080px;box-sizing:border-box;overflow:hidden}aside{display:none}*{animation:none!important}</style></head><body>
<script>document.fonts.ready.then(()=>{const s=document.querySelector("section"),r=s.getBoundingClientRect();let m=0;s.querySelectorAll("*").forEach(e=>{if(e.closest("aside")||e.tagName==="DIV"&&e.classList.contains("split"))return;const b=e.getBoundingClientRect();if(b.height)m=Math.max(m,b.bottom-r.top)});document.title="bottom "+Math.round(m)})</script></body></html>
